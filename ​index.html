<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickAI Hub</title>
    
    <!-- PWA Manifest & Theme Links -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00F0D2">
    <meta name="description" content="Smart AI Ecosystem & Auto-Update">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1B1035, #3B1E86);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
        }

        .app-card {
            background: rgba(30, 28, 60, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(138, 108, 240, 0.25);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
        }

        .app-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 240, 210, 0.2);
            object-fit: cover;
            display: block;
        }

        .app-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #00F0D2;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #B9A6FF;
            margin-bottom: 25px;
        }

        .status-box {
            background: #150d2a;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border: 1px solid #3B1E86;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: #00F0D2;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00F0D2;
        }

        #version-text {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .update-btn {
            background: linear-gradient(135deg, #00F0D2, #00B8E6);
            color: #1B1035;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 210, 0.3);
        }

        .update-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-card">
            <!-- Imgur Logo Link -->
            <img src="https://i.imgur.com/PKRRQuD.jpeg" alt="QuickAI Logo" class="app-logo">

            <h2>QuickAI Hub</h2>
            <p class="subtitle">Smart AI Ecosystem & Auto-Update</p>
            
            <div class="status-box">
                <span class="dot"></span>
                <p id="version-text">Version: v1.0</p>
            </div>

            <button class="update-btn" onclick="manualCheckUpdate()">Check for Updates</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
